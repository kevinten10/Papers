<!DOCTYPE HTML>
<html>
<head>
    <title>Knowledge Graph - 知识图谱</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
    <meta name="description" content="Kevin的知识图谱 - 交互式可视化探索技术知识体系"/>
    <meta name="keywords" content="知识图谱, 可视化, D3.js, 技术文章"/>
    <meta name="author" content="Kevin Ten"/>
    <meta property="og:title" content="Knowledge Graph - 知识图谱"/>
    <meta property="og:description" content="交互式可视化探索技术知识体系"/>
    <meta property="og:url" content="https://kevinten10.github.io/Papers/knowledge-graph.html"/>
    <link rel="canonical" href="https://kevinten10.github.io/Papers/knowledge-graph.html"/>
    <link rel="stylesheet" href="assets/css/enhanced.css"/>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="knowledge-base-data.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0e17;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #graph-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        .toolbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 1em;
            padding: 0.8em 1.5em;
            background: linear-gradient(180deg, rgba(10,14,23,0.95) 0%, rgba(10,14,23,0.7) 70%, transparent 100%);
            pointer-events: none;
        }
        .toolbar > * { pointer-events: auto; }

        .toolbar .home-btn {
            display: flex;
            align-items: center;
            gap: 0.4em;
            color: #49bf9d;
            text-decoration: none;
            font-size: 0.85em;
            padding: 0.4em 0.8em;
            border: 1px solid rgba(73,191,157,0.3);
            border-radius: 20px;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .toolbar .home-btn:hover {
            background: rgba(73,191,157,0.15);
            border-color: #49bf9d;
        }

        .toolbar h1 {
            font-size: 1.1em;
            color: #49bf9d;
            font-weight: 600;
            white-space: nowrap;
        }

        .toolbar .spacer { flex: 1; pointer-events: none; }

        .search-box {
            position: relative;
            width: 220px;
        }
        .search-box input {
            width: 100%;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(73,191,157,0.2);
            border-radius: 20px;
            padding: 0.5em 1em 0.5em 2.2em;
            color: #e0e0e0;
            font-size: 0.85em;
            outline: none;
            transition: border-color 0.3s;
        }
        .search-box input:focus { border-color: #49bf9d; }
        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 0.7em;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.8em;
            pointer-events: none;
        }

        .filter-chips {
            display: flex;
            gap: 0.4em;
            flex-wrap: wrap;
        }
        .filter-chip {
            padding: 0.3em 0.7em;
            border-radius: 15px;
            font-size: 0.75em;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            color: #aaa;
            white-space: nowrap;
        }
        .filter-chip:hover { border-color: rgba(255,255,255,0.3); color: #ddd; }
        .filter-chip.active {
            border-color: var(--chip-color, #49bf9d);
            background: var(--chip-bg, rgba(73,191,157,0.15));
            color: var(--chip-color, #49bf9d);
        }

        .stats-bar {
            position: fixed;
            bottom: 1em; left: 1.5em;
            z-index: 10;
            display: flex;
            gap: 1.5em;
            font-size: 0.8em;
            color: #666;
        }
        .stats-bar span { white-space: nowrap; }
        .stats-bar .num { color: #49bf9d; font-weight: 600; }

        .detail-panel {
            position: fixed;
            top: 0; right: 0;
            width: 360px;
            height: 100vh;
            z-index: 20;
            background: linear-gradient(135deg, rgba(15,20,35,0.98), rgba(10,14,23,0.98));
            border-left: 1px solid rgba(73,191,157,0.2);
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 2em 1.5em;
            overflow-y: auto;
            backdrop-filter: blur(20px);
        }
        .detail-panel.open { transform: translateX(0); }

        .detail-panel .close-btn {
            position: absolute;
            top: 0.8em; right: 0.8em;
            background: none; border: none;
            color: #666; font-size: 1.3em;
            cursor: pointer;
            padding: 0.3em;
            transition: color 0.3s;
        }
        .detail-panel .close-btn:hover { color: #e0e0e0; }

        .detail-panel .category-badge {
            display: inline-block;
            padding: 0.3em 0.8em;
            border-radius: 15px;
            font-size: 0.78em;
            margin-bottom: 1em;
        }

        .detail-panel h2 {
            font-size: 1.2em;
            color: #e0e0e0;
            margin-bottom: 0.6em;
            line-height: 1.4;
        }

        .detail-panel .meta {
            display: flex;
            gap: 1em;
            margin-bottom: 1.2em;
            font-size: 0.8em;
            color: #666;
        }

        .detail-panel .description {
            color: #999;
            font-size: 0.88em;
            line-height: 1.7;
            margin-bottom: 1.5em;
        }

        .detail-panel .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4em;
            margin-bottom: 1.5em;
        }
        .detail-panel .tag {
            padding: 0.2em 0.6em;
            background: rgba(73,191,157,0.1);
            border: 1px solid rgba(73,191,157,0.2);
            border-radius: 10px;
            font-size: 0.75em;
            color: #49bf9d;
        }

        .detail-panel .read-btn {
            display: inline-block;
            background: linear-gradient(135deg, #49bf9d, #3a9d7a);
            color: #fff;
            padding: 0.7em 1.5em;
            border-radius: 25px;
            text-decoration: none;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s;
        }
        .detail-panel .read-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(73,191,157,0.4);
        }

        .detail-panel .articles-list { margin-top: 1.2em; }
        .detail-panel .articles-list h3 {
            font-size: 0.9em;
            color: #49bf9d;
            margin-bottom: 0.8em;
        }
        .detail-panel .article-item {
            padding: 0.6em 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: color 0.2s;
            font-size: 0.85em;
            color: #999;
        }
        .detail-panel .article-item:hover { color: #49bf9d; }

        .tooltip {
            position: fixed;
            z-index: 15;
            background: rgba(15,20,35,0.95);
            border: 1px solid rgba(73,191,157,0.3);
            border-radius: 8px;
            padding: 0.5em 0.8em;
            font-size: 0.8em;
            color: #e0e0e0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            max-width: 250px;
            backdrop-filter: blur(10px);
        }
        .tooltip.visible { opacity: 1; }

        .legend {
            position: fixed;
            bottom: 1em; right: 1.5em;
            z-index: 10;
            font-size: 0.72em;
            color: #555;
            display: flex;
            gap: 1em;
            align-items: center;
        }
        .legend-item { display: flex; align-items: center; gap: 0.3em; }
        .legend-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        @media (max-width: 768px) {
            .toolbar { padding: 0.5em 0.8em; gap: 0.5em; }
            .toolbar h1 { font-size: 0.9em; }
            .search-box { width: 150px; }
            .filter-chips { display: none; }
            .detail-panel { width: 100%; }
            .legend { display: none; }
        }
    </style>
</head>
<body>

<canvas id="graph-canvas"></canvas>

<div class="toolbar">
    <a href="navigation.html" class="home-btn">&larr; 导航</a>
    <h1>Knowledge Graph</h1>
    <div class="spacer"></div>
    <div class="filter-chips" id="filter-chips"></div>
    <div class="search-box">
        <input type="text" id="search-input" placeholder="搜索文章..."/>
    </div>
</div>

<div class="stats-bar" id="stats-bar"></div>

<div class="detail-panel" id="detail-panel">
    <button class="close-btn" id="close-panel-btn">&times;</button>
    <div id="panel-content"></div>
</div>

<div class="tooltip" id="tooltip"></div>

<div class="legend" id="legend"></div>

<script>
// ============================================================
// 1. Parse knowledge base data into graph nodes & links
// ============================================================
var CATEGORY_COLORS = [
    '#49bf9d', '#64b5f6', '#ffb74d', '#e57373', '#81c784',
    '#ce93d8', '#4dd0e1', '#ff8a65', '#aed581', '#f06292',
    '#7986cb', '#a1887f', '#4fc3f7', '#dce775', '#ffab91',
    '#80cbc4', '#b39ddb', '#e6ee9c', '#ef9a9a', '#90caf9'
];

function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.textContent;
}

function parseKnowledgeBase(data) {
    var nodes = [];
    var links = [];
    var categories = [];
    var colorIdx = 0;

    function traverse(obj, categoryName, categoryId) {
        var keys = Object.keys(obj);
        for (var i = 0; i < keys.length; i++) {
            var key = keys[i];
            if (key === 'icon' || key === 'children') continue;
            var val = obj[key];

            if (val && typeof val === 'object' && val.path && val.type) {
                var articleId = 'a_' + nodes.length;
                nodes.push({
                    id: articleId,
                    type: 'article',
                    title: val.title || key,
                    path: val.path,
                    fileType: val.type,
                    description: val.description || '',
                    readTime: val.readTime || 1,
                    tags: val.tags || [],
                    categoryId: categoryId,
                    categoryName: categoryName,
                    r: 5
                });
                links.push({ source: categoryId, target: articleId });
            } else if (val && typeof val === 'object') {
                traverse(val, categoryName, categoryId);
            }
        }
    }

    var catKeys = Object.keys(data);
    for (var ci = 0; ci < catKeys.length; ci++) {
        var catKey = catKeys[ci];
        var catData = data[catKey];
        var categoryId = 'c_' + colorIdx;
        var color = CATEGORY_COLORS[colorIdx % CATEGORY_COLORS.length];

        categories.push({
            id: categoryId,
            name: catKey,
            icon: catData.icon || '',
            color: color
        });

        nodes.push({
            id: categoryId,
            type: 'category',
            title: catKey,
            icon: catData.icon || '',
            color: color,
            r: 30
        });

        var children = catData.children || catData;
        traverse(children, catKey, categoryId);
        colorIdx++;
    }

    var catColorMap = {};
    for (var k = 0; k < categories.length; k++) {
        catColorMap[categories[k].id] = categories[k].color;
    }
    for (var n = 0; n < nodes.length; n++) {
        if (nodes[n].type === 'article') {
            nodes[n].color = catColorMap[nodes[n].categoryId] || '#49bf9d';
        }
    }

    var catArticleCount = {};
    for (var li = 0; li < links.length; li++) {
        var src = typeof links[li].source === 'string' ? links[li].source : links[li].source.id;
        catArticleCount[src] = (catArticleCount[src] || 0) + 1;
    }
    for (var ni = 0; ni < nodes.length; ni++) {
        if (nodes[ni].type === 'category') {
            var count = catArticleCount[nodes[ni].id] || 1;
            nodes[ni].r = Math.max(20, Math.min(45, 15 + count * 1.5));
            nodes[ni].articleCount = count;
        }
    }

    return { nodes: nodes, links: links, categories: categories };
}

var graphData = parseKnowledgeBase(knowledgeBase);

// ============================================================
// 2. Canvas & D3 Force Simulation
// ============================================================
var canvas = document.getElementById('graph-canvas');
var ctx = canvas.getContext('2d');
var width, height, dpr;

function resize() {
    dpr = window.devicePixelRatio || 1;
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', function() { resize(); ticked(); });

var simulation = d3.forceSimulation(graphData.nodes)
    .force('link', d3.forceLink(graphData.links).id(function(d) { return d.id; }).distance(function(d) {
        var src = typeof d.source === 'object' ? d.source : graphData.nodes.find(function(n) { return n.id === d.source; });
        return src && src.type === 'category' ? 80 : 60;
    }).strength(0.6))
    .force('charge', d3.forceManyBody()
        .strength(function(d) { return d.type === 'category' ? -400 : -30; })
    )
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide().radius(function(d) { return d.r + 3; }))
    .force('x', d3.forceX(width / 2).strength(0.03))
    .force('y', d3.forceY(height / 2).strength(0.03))
    .alphaDecay(0.02)
    .on('tick', ticked);

// ============================================================
// 3. State
// ============================================================
var currentTransform = d3.zoomIdentity;
var hoveredNode = null;
var selectedNode = null;
var searchQuery = '';
var activeCategory = null;
var matchedNodeIds = new Set();

// ============================================================
// 4. Render
// ============================================================
function hexToRgba(hex, alpha) {
    if (!hex || hex.charAt(0) !== '#') return hex;
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

var stars = [];
for (var si = 0; si < 200; si++) {
    stars.push({
        x: Math.random(), y: Math.random(),
        r: Math.random() * 1.2 + 0.3,
        a: Math.random() * 0.4 + 0.1
    });
}

function drawStars() {
    for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        ctx.beginPath();
        ctx.arc(s.x * width, s.y * height, s.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,' + s.a + ')';
        ctx.fill();
    }
}

function isDimmed(node) {
    if (activeCategory && node.type === 'article' && node.categoryId !== activeCategory) return true;
    if (activeCategory && node.type === 'category' && node.id !== activeCategory) return true;
    if (searchQuery && matchedNodeIds.size > 0 && !matchedNodeIds.has(node.id)) return true;
    return false;
}

function drawCategoryNode(node) {
    var dimmed = isDimmed(node);
    var isHovered = hoveredNode === node;
    var r = isHovered ? node.r * 1.15 : node.r;
    var alpha = dimmed ? 0.15 : 1;

    if (!dimmed) {
        ctx.beginPath();
        var grd = ctx.createRadialGradient(node.x, node.y, r * 0.5, node.x, node.y, r * 2.5);
        grd.addColorStop(0, hexToRgba(node.color, 0.15));
        grd.addColorStop(1, 'transparent');
        ctx.fillStyle = grd;
        ctx.arc(node.x, node.y, r * 2.5, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.beginPath();
    var gradient = ctx.createRadialGradient(node.x - r * 0.3, node.y - r * 0.3, 0, node.x, node.y, r);
    gradient.addColorStop(0, hexToRgba(node.color, 0.9 * alpha));
    gradient.addColorStop(1, hexToRgba(node.color, 0.3 * alpha));
    ctx.fillStyle = gradient;
    ctx.arc(node.x, node.y, r, 0, Math.PI * 2);
    ctx.fill();

    if (isHovered || selectedNode === node) {
        ctx.beginPath();
        ctx.arc(node.x, node.y, r + 3, 0, Math.PI * 2);
        ctx.strokeStyle = hexToRgba(node.color, 0.6);
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    ctx.fillStyle = dimmed ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.9)';
    ctx.font = 'bold ' + Math.max(10, r * 0.38) + 'px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText((node.icon || '') + ' ' + node.title, node.x, node.y);
}

function drawArticleNode(node) {
    var dimmed = isDimmed(node);
    var isHovered = hoveredNode === node;
    var isMatched = searchQuery && matchedNodeIds.has(node.id);
    var r = isHovered ? node.r * 1.8 : (isMatched ? node.r * 1.3 : node.r);
    var alpha = dimmed ? 0.08 : 1;

    if (isMatched && !dimmed) {
        ctx.beginPath();
        var grd = ctx.createRadialGradient(node.x, node.y, 0, node.x, node.y, r * 3);
        grd.addColorStop(0, hexToRgba(node.color, 0.3));
        grd.addColorStop(1, 'transparent');
        ctx.fillStyle = grd;
        ctx.arc(node.x, node.y, r * 3, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.beginPath();
    var gradient = ctx.createRadialGradient(node.x, node.y, 0, node.x, node.y, r);
    gradient.addColorStop(0, hexToRgba(node.color, 0.8 * alpha));
    gradient.addColorStop(0.7, hexToRgba(node.color, 0.4 * alpha));
    gradient.addColorStop(1, hexToRgba(node.color, 0.1 * alpha));
    ctx.fillStyle = gradient;
    ctx.arc(node.x, node.y, r, 0, Math.PI * 2);
    ctx.fill();

    if (isHovered) {
        ctx.beginPath();
        ctx.arc(node.x, node.y, r + 2, 0, Math.PI * 2);
        ctx.strokeStyle = hexToRgba(node.color, 0.5);
        ctx.lineWidth = 1.5;
        ctx.stroke();
    }
}

function ticked() {
    ctx.save();
    ctx.clearRect(0, 0, width, height);
    drawStars();
    ctx.translate(currentTransform.x, currentTransform.y);
    ctx.scale(currentTransform.k, currentTransform.k);

    for (var i = 0; i < graphData.links.length; i++) {
        var link = graphData.links[i];
        var s = link.source, t = link.target;
        var dimmed = isDimmed(s) || isDimmed(t);
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(t.x, t.y);
        ctx.strokeStyle = dimmed ? 'rgba(73,191,157,0.03)' : hexToRgba(s.color || '#49bf9d', 0.12);
        ctx.lineWidth = dimmed ? 0.3 : 0.8;
        ctx.stroke();
    }

    for (var j = 0; j < graphData.nodes.length; j++) {
        if (graphData.nodes[j].type === 'article') drawArticleNode(graphData.nodes[j]);
    }
    for (var k = 0; k < graphData.nodes.length; k++) {
        if (graphData.nodes[k].type === 'category') drawCategoryNode(graphData.nodes[k]);
    }

    ctx.restore();
}

// ============================================================
// 5. Interactions
// ============================================================
var zoomBehavior = d3.zoom()
    .scaleExtent([0.2, 5])
    .on('zoom', function(event) {
        currentTransform = event.transform;
        ticked();
    });

d3.select(canvas).call(zoomBehavior);

d3.select(canvas).call(
    d3.drag()
        .container(canvas)
        .subject(function(event) {
            var pt = currentTransform.invert([event.x, event.y]);
            return findNode(pt[0], pt[1]);
        })
        .on('start', function(event) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            event.subject.fx = event.subject.x;
            event.subject.fy = event.subject.y;
        })
        .on('drag', function(event) {
            var pt = currentTransform.invert([event.x, event.y]);
            event.subject.fx = pt[0];
            event.subject.fy = pt[1];
        })
        .on('end', function(event) {
            if (!event.active) simulation.alphaTarget(0);
            event.subject.fx = null;
            event.subject.fy = null;
        })
);

canvas.addEventListener('mousemove', function(e) {
    var pt = currentTransform.invert([e.clientX, e.clientY]);
    var node = findNode(pt[0], pt[1]);
    var tooltip = document.getElementById('tooltip');

    if (node !== hoveredNode) {
        hoveredNode = node;
        canvas.style.cursor = node ? 'pointer' : 'grab';
        ticked();
    }

    if (node) {
        tooltip.textContent = node.type === 'category'
            ? (node.icon + ' ' + node.title + ' (' + (node.articleCount || 0) + ' 篇)')
            : node.title;
        tooltip.style.left = (e.clientX + 15) + 'px';
        tooltip.style.top = (e.clientY - 10) + 'px';
        tooltip.classList.add('visible');
    } else {
        tooltip.classList.remove('visible');
    }
});

canvas.addEventListener('mouseleave', function() {
    hoveredNode = null;
    document.getElementById('tooltip').classList.remove('visible');
    ticked();
});

canvas.addEventListener('click', function(e) {
    var pt = currentTransform.invert([e.clientX, e.clientY]);
    var node = findNode(pt[0], pt[1]);

    if (!node) {
        closePanel();
        activeCategory = null;
        selectedNode = null;
        ticked();
        return;
    }

    selectedNode = node;

    if (node.type === 'category') {
        activeCategory = activeCategory === node.id ? null : node.id;
        showCategoryPanel(node);
    } else {
        showArticlePanel(node);
    }
    ticked();
});

function findNode(mx, my) {
    for (var i = graphData.nodes.length - 1; i >= 0; i--) {
        var n = graphData.nodes[i];
        var dx = mx - n.x, dy = my - n.y;
        var hitR = n.type === 'category' ? n.r + 5 : n.r + 8;
        if (dx * dx + dy * dy < hitR * hitR) return n;
    }
    return null;
}

// ============================================================
// 6. Detail Panel (safe DOM construction)
// ============================================================
function clearElement(el) {
    while (el.firstChild) el.removeChild(el.firstChild);
}

function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
        Object.keys(attrs).forEach(function(key) {
            if (key === 'style' && typeof attrs[key] === 'object') {
                Object.assign(node.style, attrs[key]);
            } else if (key === 'className') {
                node.className = attrs[key];
            } else if (key.indexOf('on') === 0) {
                node.addEventListener(key.slice(2).toLowerCase(), attrs[key]);
            } else {
                node.setAttribute(key, attrs[key]);
            }
        });
    }
    if (children) {
        if (typeof children === 'string') {
            node.textContent = children;
        } else if (Array.isArray(children)) {
            children.forEach(function(c) { if (c) node.appendChild(c); });
        }
    }
    return node;
}

function showArticlePanel(node) {
    var panel = document.getElementById('detail-panel');
    var content = document.getElementById('panel-content');
    clearElement(content);

    var viewerUrl = node.fileType === 'markdown'
        ? 'viewer.html?file=' + encodeURIComponent(node.path)
        : node.path;

    content.appendChild(el('div', {
        className: 'category-badge',
        style: { background: hexToRgba(node.color, 0.15), color: node.color, border: '1px solid ' + hexToRgba(node.color, 0.3) }
    }, node.categoryName));

    content.appendChild(el('h2', null, node.title));

    var metaDiv = el('div', { className: 'meta' });
    metaDiv.appendChild(el('span', null, node.fileType === 'markdown' ? 'Markdown' : node.fileType.toUpperCase()));
    metaDiv.appendChild(el('span', null, node.readTime + ' 分钟'));
    content.appendChild(metaDiv);

    if (node.description) {
        content.appendChild(el('p', { className: 'description' }, node.description));
    }

    if (node.tags.length) {
        var tagsDiv = el('div', { className: 'tags' });
        node.tags.forEach(function(t) {
            tagsDiv.appendChild(el('span', { className: 'tag' }, t));
        });
        content.appendChild(tagsDiv);
    }

    var btnAttrs = { className: 'read-btn', href: viewerUrl };
    if (node.fileType !== 'markdown') btnAttrs.target = '_blank';
    content.appendChild(el('a', btnAttrs, '阅读文章 →'));

    panel.classList.add('open');
}

function showCategoryPanel(node) {
    var panel = document.getElementById('detail-panel');
    var content = document.getElementById('panel-content');
    clearElement(content);

    var articles = graphData.nodes.filter(function(n) {
        return n.type === 'article' && n.categoryId === node.id;
    });

    content.appendChild(el('div', {
        className: 'category-badge',
        style: { background: hexToRgba(node.color, 0.15), color: node.color, border: '1px solid ' + hexToRgba(node.color, 0.3) }
    }, node.icon + ' 分类'));

    content.appendChild(el('h2', null, node.title));

    var metaDiv = el('div', { className: 'meta' });
    metaDiv.appendChild(el('span', null, articles.length + ' 篇文章'));
    var totalTime = 0;
    for (var i = 0; i < articles.length; i++) totalTime += articles[i].readTime;
    metaDiv.appendChild(el('span', null, totalTime + ' 分钟'));
    content.appendChild(metaDiv);

    var listDiv = el('div', { className: 'articles-list' });
    listDiv.appendChild(el('h3', null, '文章列表'));
    articles.forEach(function(a) {
        var url = a.fileType === 'markdown'
            ? 'viewer.html?file=' + encodeURIComponent(a.path)
            : a.path;
        listDiv.appendChild(el('div', {
            className: 'article-item',
            onClick: function() { window.open(url, '_blank'); }
        }, a.title));
    });
    content.appendChild(listDiv);

    panel.classList.add('open');
}

function closePanel() {
    document.getElementById('detail-panel').classList.remove('open');
}

document.getElementById('close-panel-btn').addEventListener('click', closePanel);

// ============================================================
// 7. Search
// ============================================================
var searchInput = document.getElementById('search-input');
var searchTimeout;
searchInput.addEventListener('input', function() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(function() {
        searchQuery = searchInput.value.trim().toLowerCase();
        matchedNodeIds.clear();

        if (searchQuery) {
            graphData.nodes.forEach(function(n) {
                if (n.title && n.title.toLowerCase().indexOf(searchQuery) !== -1) {
                    matchedNodeIds.add(n.id);
                    if (n.categoryId) matchedNodeIds.add(n.categoryId);
                }
            });
        }
        ticked();
    }, 200);
});

// ============================================================
// 8. Filter Chips
// ============================================================
function renderFilterChips() {
    var container = document.getElementById('filter-chips');
    clearElement(container);

    var allChip = el('div', {
        className: 'filter-chip' + (activeCategory === null ? ' active' : ''),
        onClick: function() {
            activeCategory = null;
            selectedNode = null;
            closePanel();
            renderFilterChips();
            ticked();
        }
    }, '全部');
    allChip.style.setProperty('--chip-color', '#49bf9d');
    allChip.style.setProperty('--chip-bg', 'rgba(73,191,157,0.15)');
    container.appendChild(allChip);

    graphData.categories.forEach(function(cat) {
        var chip = el('div', {
            className: 'filter-chip' + (activeCategory === cat.id ? ' active' : ''),
            onClick: function() {
                activeCategory = activeCategory === cat.id ? null : cat.id;
                selectedNode = activeCategory ? graphData.nodes.find(function(n) { return n.id === cat.id; }) : null;
                renderFilterChips();
                ticked();
            }
        }, cat.icon + ' ' + cat.name);
        chip.style.setProperty('--chip-color', cat.color);
        chip.style.setProperty('--chip-bg', hexToRgba(cat.color, 0.15));
        container.appendChild(chip);
    });
}
renderFilterChips();

// ============================================================
// 9. Stats & Legend
// ============================================================
function renderStats() {
    var statsBar = document.getElementById('stats-bar');
    clearElement(statsBar);
    var totalArticles = graphData.nodes.filter(function(n) { return n.type === 'article'; }).length;
    var totalCategories = graphData.categories.length;
    var totalReadTime = 0;
    graphData.nodes.forEach(function(n) { totalReadTime += (n.readTime || 0); });

    var s1 = el('span');
    s1.appendChild(el('span', { className: 'num' }, String(totalArticles)));
    s1.appendChild(document.createTextNode(' 篇文章'));
    statsBar.appendChild(s1);

    var s2 = el('span');
    s2.appendChild(el('span', { className: 'num' }, String(totalCategories)));
    s2.appendChild(document.createTextNode(' 个分类'));
    statsBar.appendChild(s2);

    var s3 = el('span');
    s3.appendChild(el('span', { className: 'num' }, String(Math.round(totalReadTime / 60))));
    s3.appendChild(document.createTextNode(' 小时阅读量'));
    statsBar.appendChild(s3);
}
renderStats();

function renderLegend() {
    var container = document.getElementById('legend');
    clearElement(container);
    var max = Math.min(8, graphData.categories.length);
    for (var i = 0; i < max; i++) {
        var item = el('span', { className: 'legend-item' });
        item.appendChild(el('span', { className: 'legend-dot', style: { background: graphData.categories[i].color } }));
        item.appendChild(document.createTextNode(graphData.categories[i].name));
        container.appendChild(item);
    }
    if (graphData.categories.length > 8) {
        container.appendChild(el('span', null, '...'));
    }
}
renderLegend();

// ============================================================
// 10. Entry animation & keyboard
// ============================================================
for (var ei = 0; ei < graphData.nodes.length; ei++) {
    graphData.nodes[ei].x = width / 2 + (Math.random() - 0.5) * 50;
    graphData.nodes[ei].y = height / 2 + (Math.random() - 0.5) * 50;
}
simulation.alpha(1).restart();

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        closePanel();
        activeCategory = null;
        selectedNode = null;
        searchInput.value = '';
        searchQuery = '';
        matchedNodeIds.clear();
        renderFilterChips();
        ticked();
    }
});
</script>
</body>
</html>
