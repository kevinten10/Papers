<!DOCTYPE HTML>
<html lang="zh-CN">
<head>
    <title>Kevin KB Reader</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="description" content="Kevin KB Markdown reader."/>
    <link rel="stylesheet" href="assets/css/kb-modern.css?v=3.0.0"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
</head>
<body class="kb-modern">
<header class="kb-topbar">
    <div class="kb-topbar__inner">
        <a class="kb-brand" href="index.html" aria-label="Kevin KB home">
            <span class="kb-brand__mark">K</span>
            <span class="kb-brand__text">
                <span class="kb-brand__name">Kevin KB Reader</span>
                <span class="kb-brand__meta">Focused Markdown reading</span>
            </span>
        </a>
        <nav class="kb-nav" aria-label="Primary">
            <a href="index.html">Home</a>
            <a href="knowledge-base.html">Knowledge Base</a>
            <a href="articles.html">Articles</a>
        </nav>
    </div>
</header>

<main class="kb-reader-shell">
    <div class="kb-actions">
        <a class="kb-button" id="viewerBack" href="knowledge-base.html">Back to knowledge base</a>
        <a class="kb-button kb-button--ghost" href="articles.html">Browse articles</a>
    </div>
    <header class="kb-reader-head">
        <div class="kb-kicker">Markdown reader</div>
        <h1 id="viewerTitle">Loading article</h1>
        <div class="kb-reader-meta">
            <span id="viewerPath">Resolving file path...</span>
        </div>
    </header>
    <div class="kb-status" id="viewerStatus">Loading Markdown content...</div>
    <div class="kb-reader-layout">
        <aside class="kb-panel kb-reader-toc" id="viewerToc" hidden></aside>
        <article class="kb-reader-content" id="viewerContent" hidden></article>
    </div>
</main>

<footer class="kb-footer">
    <div class="kb-footer__inner">
        <span>Kevin's Knowledge Base</span>
        <span>Reader view for long technical notes.</span>
    </div>
</footer>

<script src="assets/js/kb-modern.js?v=3.0.0"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
    KBModern.setupViewer();
});
</script>
</body>
</html>
