<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#49bf9d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a9d7a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景圆 -->
  <circle cx="50" cy="50" r="45" fill="url(#grad1)" stroke="#2d7d63" stroke-width="2"/>

  <!-- 书本形状 -->
  <rect x="25" y="30" width="35" height="40" rx="3" ry="3" fill="#ffffff" opacity="0.9"/>
  <rect x="20" y="25" width="35" height="40" rx="3" ry="3" fill="#ffffff" opacity="0.8"/>

  <!-- 书脊 -->
  <rect x="55" y="25" width="8" height="45" rx="4" ry="4" fill="#49bf9d" opacity="0.9"/>

  <!-- 书页线条 -->
  <line x1="30" y1="35" x2="50" y2="35" stroke="#49bf9d" stroke-width="1" opacity="0.6"/>
  <line x1="30" y1="42" x2="50" y2="42" stroke="#49bf9d" stroke-width="1" opacity="0.6"/>
  <line x1="30" y1="49" x2="50" y2="49" stroke="#49bf9d" stroke-width="1" opacity="0.6"/>
  <line x1="30" y1="56" x2="50" y2="56" stroke="#49bf9d" stroke-width="1" opacity="0.6"/>
  <line x1="30" y1="63" x2="50" y2="63" stroke="#49bf9d" stroke-width="1" opacity="0.6"/>
</svg>