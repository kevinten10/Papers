        :root {
            --primary-color: #49bf9d;
            --primary-dark: #3a9d7a;
            --accent-color: #64b5f6;
            --warning-color: #ffb74d;
            --success-color: #81c784;
            --error-color: #e57373;
        }

        .knowledge-dashboard {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2em;
            min-height: 100vh;
        }

        .sidebar {
            background: var(--kh-bg-glass);
            backdrop-filter: blur(12px);
            border-radius: var(--kh-radius);
            padding: 1.5em;
            border: 1px solid var(--kh-border);
            position: sticky;
            top: 20px;
            height: fit-content;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            animation: kh-slideRight 0.5s cubic-bezier(0.22,1,0.36,1) 0.1s both;
        }

        .content-area {
            background: rgba(255,255,255,0.02);
            border-radius: var(--kh-radius);
            padding: 2em;
            border: 1px solid rgba(255,255,255,0.06);
            animation: kh-fadeInUp 0.6s cubic-bezier(0.22,1,0.36,1) 0.15s both;
        }

        .search-advanced {
            position: relative;
            margin-bottom: 2em;
        }

        .search-input {
            width: 100%;
            padding: 1em 1em 1em 3em;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(73, 191, 157, 0.3);
            border-radius: 25px;
            color: white;
            font-size: 1em;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 20px rgba(73, 191, 157, 0.3);
        }

        .search-icon {
            position: absolute;
            left: 1em;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-color);
            font-size: 1.2em;
        }

        .filter-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5em;
            margin-top: 1em;
        }

        .filter-tag {
            background: rgba(73, 191, 157, 0.2);
            color: var(--primary-color);
            padding: 0.3em 0.8em;
            border-radius: 15px;
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .filter-tag:hover, .filter-tag.active {
            background: var(--primary-color);
            color: white;
            transform: translateY(-2px);
        }

        .category-tree {
            margin-top: 2em;
        }

        .tree-node {
            margin-bottom: 0.5em;
        }

        .tree-toggle {
            background: none;
            border: none;
            color: var(--primary-color);
            cursor: pointer;
            font-size: 1em;
            padding: 0.5em;
            border-radius: 5px;
            transition: all 0.3s ease;
            width: 100%;
            text-align: left;
        }

        .tree-toggle:hover {
            background: rgba(73, 191, 157, 0.1);
        }

        .tree-children {
            margin-left: 1em;
            border-left: 2px solid rgba(73, 191, 157, 0.2);
            padding-left: 1em;
            margin-top: 0.5em;
        }

        .tree-children.collapsed {
            display: none;
        }

        .article-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5em;
            margin-top: 2em;
        }

        .article-card {
            background: var(--kh-bg-glass);
            backdrop-filter: blur(8px);
            border-radius: var(--kh-radius);
            padding: 1.5em;
            border: 1px solid var(--kh-border);
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
            overflow: hidden;
        }

        .article-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--kh-primary), var(--kh-accent));
            opacity: 0;
            transition: opacity 0.3s;
        }
        .article-card:hover::before { opacity: 1; }

        .article-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(73, 191, 157, 0.15);
            border-color: var(--kh-border-hover);
        }

        .article-title {
            color: var(--primary-color);
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 0.8em;
            line-height: 1.4;
        }

        .article-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1em;
            font-size: 0.9em;
            color: rgba(255,255,255,0.7);
        }

        .article-type {
            background: var(--accent-color);
            color: white;
            padding: 0.2em 0.6em;
            border-radius: 10px;
            font-size: 0.8em;
        }

        .article-description {
            color: rgba(255,255,255,0.8);
            line-height: 1.6;
            margin-bottom: 1em;
        }

        .article-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3em;
            margin-bottom: 1em;
        }

        .article-tag {
            background: rgba(73, 191, 157, 0.2);
            color: var(--primary-color);
            padding: 0.2em 0.5em;
            border-radius: 8px;
            font-size: 0.7em;
        }

        .article-actions {
            display: flex;
            gap: 0.5em;
        }

        .btn-read {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            padding: 0.5em 1em;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .btn-read:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(73, 191, 157, 0.4);
            color: white;
        }

        .stats-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1em;
            margin-bottom: 2em;
        }

        .stat-card {
            background: var(--kh-bg-glass);
            backdrop-filter: blur(8px);
            border-radius: var(--kh-radius);
            padding: 1.5em;
            text-align: center;
            border: 1px solid var(--kh-border);
            transition: all 0.3s cubic-bezier(0.22,1,0.36,1);
        }
        .stat-card:hover {
            border-color: var(--kh-border-hover);
            transform: translateY(-2px);
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: var(--primary-color);
        }

        .stat-label {
            color: rgba(255,255,255,0.8);
            margin-top: 0.5em;

        .breadcrumb {
            background: rgba(73, 191, 157, 0.1);
            padding: 1em;
            border-radius: 8px;
            margin-bottom: 2em;
            border-left: 4px solid var(--primary-color);

            width: 20px;
            height: 20px;
            border: 3px solid rgba(73, 191, 157, 0.3);
            border-radius: 50%;

            padding: 3em;
            color: rgba(255,255,255,0.6);

document.addEventListener('DOMContentLoaded', function() {
    // 如果没有自动生成的知识库数据，使用默认数据

        knowledgeBase = {
            categories: {

            }
        };
    }

    initializeKnowledgeBase();
    setupEventListeners();
});

function initializeKnowledgeBase() {
    generateCategoryTree();
    generateArticleGrid();
    updateStatistics();
    
    // 隐藏加载指示器
    setTimeout(() => {
        document.getElementById('loadingIndicator').style.display = 'none';
        document.getElementById('articleGrid').style.display = 'grid';
    }, 1500);
}

function generateCategoryTree() {
    const treeContainer = document.getElementById('categoryTree');
    let treeHTML = '';
    
    Object.entries(knowledgeBase.categories).forEach(([categoryName, categoryData]) => {
        treeHTML += `
            <div class="tree-node">
                <button class="tree-toggle" onclick="toggleCategory('${categoryName}')">
                    ${categoryData.icon} ${categoryName} <span class="toggle-icon">▼</span>
                </button>
                <div class="tree-children" id="tree-${categoryName}">
        `;
        
        if (categoryData.children) {
            Object.entries(categoryData.children).forEach(([subName, subData]) => {
                const articleCount = subData.articles ? subData.articles.length : 0;
                treeHTML += `
                    <div class="tree-node">
                        <button class="tree-toggle" onclick="filterByCategory('${categoryName}', '${subName}')">
                            ${subData.icon} ${subName} (${articleCount})
                        </button>
                    </div>
                `;
            });
        } else if (categoryData.articles) {
            treeHTML += `
                <div class="tree-node">
                    <button class="tree-toggle" onclick="filterByCategory('${categoryName}')">
                        📄 ${categoryData.articles.length} 篇文章
                    </button>
                </div>
            `;
        }
        
        treeHTML += `
                </div>
            </div>
        `;
    });
    
    treeContainer.innerHTML += treeHTML;
}

function generateArticleGrid() {
    const gridContainer = document.getElementById('articleGrid');
    let articlesHTML = '';
    
    // 收集所有文章
    const allArticles = [];
    Object.entries(knowledgeBase.categories).forEach(([categoryName, categoryData]) => {
        if (categoryData.children) {
            Object.entries(categoryData.children).forEach(([subName, subData]) => {
                if (subData.articles) {
                    subData.articles.forEach(article => {
                        allArticles.push({
                            ...article,
                            category: categoryName,
                            subcategory: subName
                        });
                    });
                }
            });
        } else if (categoryData.articles) {
            categoryData.articles.forEach(article => {
                allArticles.push({
                    ...article,
                    category: categoryName
                });
            });
        }
    });
    
    // 生成文章卡片
    allArticles.forEach(article => {
        const typeIcon = article.type === 'markdown' ? '📄' : '📁';
        const tagsHTML = article.tags.map(tag => 
            `<span class="article-tag">${tag}</span>`
        ).join('');
        
        articlesHTML += `
            <div class="article-card" data-category="${article.category}" data-tags="${article.tags.join(',').toLowerCase()}">
                <div class="article-meta">
                    <span class="article-type">${typeIcon} ${article.type}</span>
                    <span>⏱️ ${article.readTime}分钟</span>
                </div>
                <h3 class="article-title">${article.title}</h3>
                <p class="article-description">${article.description}</p>
                <div class="article-tags">${tagsHTML}</div>
                <div class="article-actions">
                    <a href="viewer.html?file=${encodeURIComponent(article.path)}" class="btn-read">
                        📖 阅读文章
                    </a>
                </div>
            </div>
        `;
    });
    
    gridContainer.innerHTML = articlesHTML;
}

function updateStatistics() {
    let totalArticles = 0;
    let totalCategories = 0;
    let totalReadingTime = 0;
    const allTags = new Set();
    
    Object.entries(knowledgeBase.categories).forEach(([categoryName, categoryData]) => {
        totalCategories++;
        
        if (categoryData.children) {
            Object.entries(categoryData.children).forEach(([subName, subData]) => {
                if (subData.articles) {
                    totalArticles += subData.articles.length;
                    subData.articles.forEach(article => {
                        totalReadingTime += article.readTime;
                        article.tags.forEach(tag => allTags.add(tag));
                    });
                }
            });
        } else if (categoryData.articles) {
            totalArticles += categoryData.articles.length;
            categoryData.articles.forEach(article => {
                totalReadingTime += article.readTime;
                article.tags.forEach(tag => allTags.add(tag));
            });
        }
    });
    
    // 动画更新数字
    animateNumber('totalArticles', totalArticles);
    animateNumber('totalCategories', totalCategories);
    animateNumber('totalTags', allTags.size);
    animateNumber('readingTime', Math.round(totalReadingTime / 60));
}

function animateNumber(elementId, targetValue) {
    const element = document.getElementById(elementId);
    let currentValue = 0;
    const increment = targetValue / 50;
    
    const timer = setInterval(() => {
        currentValue += increment;
        if (currentValue >= targetValue) {
            currentValue = targetValue;
            clearInterval(timer);
        }
        element.textContent = Math.floor(currentValue);
    }, 30);
}

function setupEventListeners() {
    // 搜索功能
    const searchInput = document.getElementById('advancedSearch');
    searchInput.addEventListener('input', debounce(performSearch, 300));
    
    // 筛选标签
    const filterTags = document.querySelectorAll('.filter-tag');
    filterTags.forEach(tag => {
        tag.addEventListener('click', function() {
            filterTags.forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            filterArticles(this.dataset.filter);
        });
    });
}

function debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
        const later = () => {
            clearTimeout(timeout);
            func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
    };
}

function performSearch() {
    const searchTerm = document.getElementById('advancedSearch').value.toLowerCase();
    const articles = document.querySelectorAll('.article-card');
    let visibleCount = 0;
    
    articles.forEach(article => {
        const title = article.querySelector('.article-title').textContent.toLowerCase();
        const description = article.querySelector('.article-description').textContent.toLowerCase();
        const tags = article.dataset.tags;
        
        const isVisible = title.includes(searchTerm) || 
                         description.includes(searchTerm) || 
                         tags.includes(searchTerm);
        
        article.style.display = isVisible ? 'block' : 'none';
        if (isVisible) visibleCount++;
    });
    
    // 显示/隐藏无结果提示
    document.getElementById('noResults').style.display = visibleCount === 0 ? 'block' : 'none';
    document.getElementById('articleGrid').style.display = visibleCount === 0 ? 'none' : 'grid';
}

function filterArticles(filter) {
    const articles = document.querySelectorAll('.article-card');
    let visibleCount = 0;
    
    articles.forEach(article => {
        const shouldShow = filter === 'all' || 
                          article.dataset.category.toLowerCase().includes(filter) ||
                          article.dataset.tags.includes(filter);
        
        article.style.display = shouldShow ? 'block' : 'none';
        if (shouldShow) visibleCount++;
    });
    
    // 显示/隐藏无结果提示
    document.getElementById('noResults').style.display = visibleCount === 0 ? 'block' : 'none';
    document.getElementById('articleGrid').style.display = visibleCount === 0 ? 'none' : 'grid';
}

function toggleCategory(categoryName) {
    const treeChildren = document.getElementById(`tree-${categoryName}`);
    const toggleIcon = event.target.querySelector('.toggle-icon');
    
    if (treeChildren.classList.contains('collapsed')) {
        treeChildren.classList.remove('collapsed');
        toggleIcon.textContent = '▼';
    } else {
        treeChildren.classList.add('collapsed');
        toggleIcon.textContent = '▶';
    }
}

function filterByCategory(category, subcategory = null) {
    const articles = document.querySelectorAll('.article-card');
    let visibleCount = 0;
    
    articles.forEach(article => {
        const articleCategory = article.dataset.category;
        const shouldShow = articleCategory === category;
        
        article.style.display = shouldShow ? 'block' : 'none';
        if (shouldShow) visibleCount++;
    });
    
    // 显示/隐藏无结果提示
    document.getElementById('noResults').style.display = visibleCount === 0 ? 'block' : 'none';
    document.getElementById('articleGrid').style.display = visibleCount === 0 ? 'none' : 'grid';
}
